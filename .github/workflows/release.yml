name: Release

# Builds, signs, notarizes, and publishes AIUsageMenuBar whenever a version
# tag is pushed (e.g. `git tag v1.2.0 && git push --tags`), then publishes
# the Sparkle appcast so existing installs pick up the update. See the
# "Distributing a standalone build" section of the README for the one-time
# secrets setup this depends on.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: AIUsageMenuBar

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.x"

      - name: Generate Xcode project
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Shared by every later step.
          {
            echo "VERSION=$VERSION"
            echo "APP=$RUNNER_TEMP/build/Build/Products/Release/$APP_NAME.app"
            echo "ZIP=$RUNNER_TEMP/$APP_NAME.zip"
          } >> "$GITHUB_ENV"

          sed -i '' "s/CFBundleShortVersionString: \".*\"/CFBundleShortVersionString: \"$VERSION\"/" project.yml
          sed -i '' "s/CFBundleVersion: \".*\"/CFBundleVersion: \"$VERSION\"/" project.yml
          brew install xcodegen
          xcodegen generate

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          p12-password: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}

      # A plain `xcodebuild build` signs for debugging: it injects the
      # get-task-allow entitlement and skips the secure timestamp, and the
      # notary service rejects both. Override each so this build is
      # notarizable without a separate archive/export step.
      - name: Build Release
        run: |
          xcodebuild -project "$APP_NAME.xcodeproj" -scheme "$APP_NAME" -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            build

      # Xcode leaves Sparkle's nested helpers signed by Sparkle's own
      # identity with no secure timestamp, which the notary service rejects.
      # Re-sign them with our Developer ID, innermost first, then the
      # framework and the app (each seal covers the layer below it). See
      # https://sparkle-project.org/documentation/sandboxing/ for the order.
      - name: Re-sign Sparkle helpers and verify
        run: |
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework/Versions/B"
          IDENTITY=$(security find-identity -v -p codesigning | awk '/Developer ID Application/ {print $2; exit}')
          SIGN=(codesign --force --options runtime --timestamp --sign "$IDENTITY")

          "${SIGN[@]}" "$SPARKLE/XPCServices/Installer.xpc"
          "${SIGN[@]}" --preserve-metadata=entitlements "$SPARKLE/XPCServices/Downloader.xpc"
          "${SIGN[@]}" "$SPARKLE/Autoupdate"
          "${SIGN[@]}" "$SPARKLE/Updater.app"
          "${SIGN[@]}" "$APP/Contents/Frameworks/Sparkle.framework"
          "${SIGN[@]}" --preserve-metadata=entitlements "$APP"

          codesign --verify --deep --strict --verbose=2 "$APP"
          # Shown for diagnosing notarization rejections: get-task-allow must
          # be absent and the signature needs a timestamp + runtime flag.
          codesign -d --entitlements - "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "flags|Timestamp"

      - name: Notarize and staple
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          ditto -c -k --keepParent "$APP" "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$TEAM_ID" --password "$NOTARY_PASSWORD" \
            --wait --output-format json > "$RUNNER_TEMP/notary.json"
          cat "$RUNNER_TEMP/notary.json"
          # `--wait` exits 0 even when the submission is Invalid, so check
          # the status and print Apple's log (the actual rejection reasons).
          if [ "$(jq -r .status "$RUNNER_TEMP/notary.json")" != "Accepted" ]; then
            xcrun notarytool log "$(jq -r .id "$RUNNER_TEMP/notary.json")" \
              --apple-id "$NOTARY_APPLE_ID" --team-id "$TEAM_ID" --password "$NOTARY_PASSWORD"
            exit 1
          fi
          xcrun stapler staple "$APP"

          # Re-zip so the distributed archive contains the stapled ticket.
          rm "$ZIP"
          ditto -c -k --keepParent "$APP" "$ZIP"

      # sign_update ships with the Sparkle package Xcode already resolved, so
      # the signing tool always matches the framework version in the app.
      - name: Sign update archive for Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          KEY_FILE="$RUNNER_TEMP/sparkle_private_key"
          echo "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          SIG_ATTRS=$("$RUNNER_TEMP/build/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update" "$ZIP" -f "$KEY_FILE")
          rm "$KEY_FILE"
          echo "SIG_ATTRS=$SIG_ATTRS" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --title "AI Usage $VERSION" --generate-notes

      - name: Publish Sparkle appcast
        run: |
          node scripts/update-appcast.mjs \
            --version "$VERSION" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$APP_NAME.zip" \
            --sig-attrs "$SIG_ATTRS"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml
          git commit -m "Publish appcast for $GITHUB_REF_NAME"
          git push origin HEAD:main
